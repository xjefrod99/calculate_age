[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculate-age"
version = "0.1.2"
description = "Calculate ages from date columns in Pandas or Polars DataFrames"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE-MIT"}
authors = [{name = "Jeff Rodriguez", email = "jeffrodriguez4321@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pandas>=2.0",
    "polars>=0.20",
]

[project.urls]
Homepage = "https://github.com/xjefrod99/calculate_age"
Source = "https://github.com/xjefrod99/calculate_age"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist",
    "black",
    "mypy",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
